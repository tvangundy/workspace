  - name: siderolabs/talos@v1.12.4
  - name: kubernetes/kubectl@v1.35.1
  - name: go-task/task@v3.48.0
  - name: docker/cli@v29.2.1
  - name: docker/compose@v5.0.2
  - name: aws/aws-cli@2.33.28
  - name: helm/helm@v4.1.1
  - name: fluxcd/flux2@v2.7.5
  - name: hashicorp/vault@v1.21.2
  - name: derailed/k9s@v0.50.18
  - name: lxc/incus@v6.21.0
